version: '3.8'

services:
  # Flask API Backend
  backend:
    build: .
    container_name: dcf_backend
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - app_logs:/app/logs
    networks:
      - dcf_network
    # Internal port only - not exposed externally

  # Astro Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dcf_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - API_URL=http://backend:5000/api
    volumes:
      - frontend_logs:/app/logs
    networks:
      - dcf_network
    depends_on:
      - backend

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: dcf_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - dcf_network
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  app_logs:
  frontend_logs:
  nginx_logs:

networks:
  dcf_network:
    driver: bridge
